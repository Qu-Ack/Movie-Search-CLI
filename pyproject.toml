[project]
name = "movie-search"
version = "0.1.0"
description = "Movie Search and RAG CLI using hybrid search and Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.15",
    "google-genai>=2.0.0",
    "nltk>=3.10.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=5.6.1",
]

[project.scripts]
movie-search = "movie_search.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
